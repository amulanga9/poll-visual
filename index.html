<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Живой опрос</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#12122a;--empty:#23244a;--sit:#6f7196}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#fff;font-family:Manrope,system-ui,sans-serif;font-weight:500;min-height:100vh}
#app{padding:16px}
h1{font-weight:800;font-size:clamp(22px,3.4vw,48px);margin-bottom:16px}
input,button{font:inherit;font-size:18px;padding:10px 14px;border:0;border-radius:10px;margin:4px 8px 4px 0}
button{cursor:pointer;background:#fff;color:#12122a;font-weight:800}
.card{background:var(--empty);border-radius:16px;padding:16px;margin-bottom:14px;max-width:520px}
.card h2{font-size:18px;font-weight:800;margin-bottom:6px}
.hint{color:#b8b9d8;font-size:14px;margin-bottom:8px}
.danger button{background:#ff5c7a;color:#fff}
.home a{display:block;margin:12px 0;color:#fff;font-size:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:62vh}
.opt{font-weight:800;font-size:clamp(16px,4.5vw,24px);border-radius:22px;padding:10px;line-height:1.3;transition:opacity .2s,transform .2s;margin:0}
.opt.sel{outline:6px solid #fff;transform:scale(1.03)}
.opt.dim{opacity:.35}
.seat{margin-bottom:10px;color:#b8b9d8}
.ok{color:#1fcb9b;font-weight:800;margin-bottom:10px}
.bad{color:#ff5c7a;font-weight:800;margin-bottom:10px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qc{background:#fff;color:#000;text-align:center;padding:8px;border-radius:8px}
.qc div{display:flex;justify-content:center}
.qc b{display:block;font-size:20px}

.scr{height:100vh;padding:3.5vh 4vw;display:flex;flex-direction:column;gap:2vh;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:3vw}
.hd h1{font-size:clamp(24px,3.6vw,64px);line-height:1.1;margin:0;max-width:62vw}
.sub{color:#8b8db5;font-size:clamp(13px,1.3vw,22px);margin-top:1vh}
.pg{text-align:right}
.pills{display:flex;gap:.6vw;justify-content:flex-end}
.pills i{width:2.2vw;height:.7vh;border-radius:9px;background:rgba(255,255,255,.15);transition:background .3s}
.pills i.on{background:#fff}
.who{margin-top:1.6vh;color:#b8b9d8;font-size:clamp(14px,1.5vw,26px);font-weight:800}
.hall{--d:min(3.6vw,7.4vh);flex:1;display:flex;align-items:center;justify-content:center;gap:calc(var(--d)*1.4)}
.blk{display:grid;gap:calc(var(--d)*.3)}
.b10{grid-template-columns:repeat(10,var(--d))}
.b7{grid-template-columns:repeat(7,var(--d))}
.s{width:var(--d);height:var(--d);border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.11);transition:background .5s,box-shadow .5s}
.hall.t .s{cursor:pointer}
.leg{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5vw}
.bar{height:.7vh;border-radius:9px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .6s}
.lg .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.4vh;gap:1vw}
.lg span{font-size:clamp(14px,1.5vw,26px);font-weight:800}
.lg b{font-size:clamp(30px,3.6vw,64px);font-weight:800;line-height:1}
.k{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:.55em}
.dg{position:fixed;right:1vw;bottom:.6vh;font-size:11px;opacity:.3}
.dg.bad{opacity:1;color:#ff5c7a;font-weight:800;font-size:14px}
@media print{body{background:#fff}}
</style></head><body><div id="app"></div>
<script>
const V = 'v4';
const {url: SUPABASE_URL, key: SUPABASE_KEY} = window.CFG || {}; // ключи лежат в config.js

// Порядок вариантов = цвета: коралловый, фиолетовый, янтарный, мятный
const Q = {
  1: {q: 'Как вы проводите свободное время?', o: [['📱','Соцсети, скроллинг'],['🎮','Видеоигры'],['📚','Саморазвитие: курсы, книги'],['💬','Прогулки, встречи, разговоры']]},
  2: {q: 'Какое у вас направление?', o: [['⚙️','Backend'],['📊','Data Science'],['🎨','UX/UI и дизайн'],['🧭','Другое или пока выбираю']]},
  3: {q: 'Что для вас главное в работе?', o: [['💰','Хорошая зарплата'],['🧩','Интересные задачи'],['🤝','Команда и люди'],['🕊️','Свобода и гибкий график']]},
  4: {q: 'Как вы лучше всего учитесь?', o: [['🎬','Видео и курсы'],['📖','Книги и статьи'],['🛠️','Практика в реальном проекте'],['👥','С наставником или в группе']]},
  5: {q: 'Что вам нужнее всего от клуба?', o: [['🧑‍🏫','Ментор'],['🌐','Знакомства и нетворкинг'],['💻','Практика и проекты'],['✨','Вдохновение и поддержка']]}
};
const TOTAL = 5;
const COL = ['#ff5c7a', '#7c5cff', '#ffb020', '#1fcb9b'];
const TXT = ['#fff', '#fff', '#1a1a2e', '#1a1a2e'];
const ROWS = 'ABCDEFG'.split('');
const NUMS = 17; // места 1-10: большая часть (7x10), 11-17: малая (7x7), между ними проход

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const app = $('#app');
const q = new URLSearchParams(location.search);

async function getQuestion() {
  const {data} = await db.from('state').select('current_question').eq('id', 1).maybeSingle();
  return data && Q[data.current_question] ? data.current_question : 1;
}
function watch(tables, fn, poll) {
  let t;
  const run = () => { clearTimeout(t); t = setTimeout(fn, 150); };
  const ch = db.channel('w' + Math.random());
  tables.forEach(tb => ch.on('postgres_changes', {event: '*', schema: 'public', table: tb}, run));
  ch.subscribe();
  setInterval(fn, poll); // запасной опрос: работает, даже если realtime не включён
}

// ---------- Телефон ----------
async function phone() {
  let id = localStorage.getItem('did');
  if (!id) {
    id = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random();
    localStorage.setItem('did', id);
  }
  const seat = q.get('seat').toUpperCase();
  const r = await db.from('people').upsert({device_id: id, seat});
  if (r.error) { app.innerHTML = '<p class="bad">Ошибка входа: ' + r.error.message + '</p>'; return; }
  let cur = 0, mine = null, st = '';
  async function refresh() {
    const n = await getQuestion();
    if (n !== cur) {
      cur = n; st = '';
      const {data} = await db.from('answers').select('answer').eq('question_id', n).eq('device_id', id).maybeSingle();
      mine = data ? data.answer : null;
    }
    draw();
  }
  function draw() {
    const Qn = Q[cur];
    if (!Qn) return;
    const msg = st === 'ok' ? '<p class="ok">✓ Ответ принят. Ваше место горит на экране. Можно изменить.</p>'
      : st ? `<p class="bad">Ответ не сохранился: ${st}</p>` : '';
    app.innerHTML = `<div class="seat">Место ${seat}, вопрос ${cur} из ${TOTAL} (${V})</div><h1>${Qn.q}</h1>${msg}<div class="opts">` +
      Qn.o.map((o, i) => `<button class="opt ${mine === null ? '' : mine === String(i) ? 'sel' : 'dim'}" data-i="${i}" style="background:${COL[i]};color:${TXT[i]}">${o[0]}<br>${o[1]}</button>`).join('') + '</div>';
  }
  app.onclick = async e => {
    const b = e.target.closest('.opt');
    if (!b) return;
    mine = b.dataset.i; st = ''; draw();
    const p = await db.from('people').upsert({device_id: id, seat}); // место записывается заново, даже если админ очистил базу
    const a = await db.from('answers').upsert({question_id: cur, device_id: id, answer: mine}, {onConflict: 'question_id,device_id'});
    const er = p.error || a.error;
    st = er ? er.message : 'ok';
    draw();
  };
  refresh();
  watch(['state'], refresh, 4000);
}

// Тестовый режим (?screen&test): клик по месту показывает его QR, сканируйте телефоном
function showQR(seat) {
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:9';
  m.innerHTML = `<div style="background:#fff;color:#000;padding:20px;border-radius:16px;text-align:center"><div id="mq" style="display:flex;justify-content:center"></div><b style="font-size:28px">${seat}</b><p>Наведите камеру телефона. Клик закроет окно.</p></div>`;
  m.onclick = () => m.remove();
  document.body.append(m);
  new QRCode($('#mq'), {text: location.origin + location.pathname + '?seat=' + seat, width: 240, height: 240});
}

// ---------- Большой экран ----------
function screenView() {
  app.style.padding = '0';
  const blk = (a, b) => ROWS.map(r => { let h = ''; for (let n = a; n <= b; n++) h += `<div class="s" data-s="${r}${n}"></div>`; return h; }).join('');
  app.innerHTML = `<div class="scr"><div class="hd"><div><h1 id="qt"></h1><p class="sub">Отсканируйте QR на своём кресле и выберите ответ</p></div>
    <div class="pg"><div class="pills">${Object.keys(Q).map(n => `<i data-n="${n}"></i>`).join('')}</div><p class="who" id="who"></p></div></div>
    <div class="hall${q.has('test') ? ' t' : ''}"><div class="blk b10">${blk(1, 10)}</div><div class="blk b7">${blk(11, 17)}</div></div>
    <div class="leg" id="leg"></div><div class="dg" id="dg"></div></div>`;
  async function load() {
    const n = await getQuestion();
    const [p, a] = await Promise.all([
      db.from('people').select('*'),
      db.from('answers').select('*').eq('question_id', n)
    ]);
    $('#qt').textContent = Q[n].q;
    document.querySelectorAll('.pills i').forEach(i => i.className = +i.dataset.n === n ? 'on' : '');
    const ans = {}, seated = {}, cnt = [0, 0, 0, 0];
    (a.data || []).forEach(x => ans[x.device_id] = x.answer);
    (p.data || []).forEach(x => seated[x.seat] = x.device_id);
    document.querySelectorAll('.s').forEach(el => {
      const d = seated[el.dataset.s], an = d ? ans[d] : undefined;
      if (an !== undefined && COL[an]) { el.style.background = COL[an]; el.style.boxShadow = `0 0 calc(var(--d)*.6) ${COL[an]}aa`; }
      else if (d) { el.style.background = '#5d6090'; el.style.boxShadow = 'none'; }
      else { el.style.background = ''; el.style.boxShadow = ''; }
    });
    const people = Object.values(seated);
    people.forEach(d => { if (COL[ans[d]]) cnt[ans[d]]++; });
    const answered = cnt.reduce((x, y) => x + y, 0);
    $('#who').textContent = 'Ответили ' + answered + ' из ' + people.length;
    $('#leg').innerHTML = Q[n].o.map((o, i) =>
      `<div class="lg"><div class="bar"><i style="width:${answered ? cnt[i] / answered * 100 : 0}%;background:${COL[i]}"></i></div>
       <div class="row"><span><i class="k" style="background:${COL[i]};box-shadow:0 0 12px ${COL[i]}aa"></i>${o[1]}</span><b style="color:${COL[i]}">${cnt[i]}</b></div></div>`
    ).join('');
    const er = p.error || a.error, dg = $('#dg');
    dg.className = er ? 'dg bad' : 'dg';
    dg.textContent = er ? 'Ошибка базы: ' + er.message : V + ' ' + new Date().toLocaleTimeString();
  }
  if (q.has('test')) $('.hall').onclick = e => { const c = e.target.closest('.s'); if (c) showQR(c.dataset.s); };
  load();
  watch(['people', 'answers', 'state'], load, 2000);
}

// ---------- Админка ----------
function admin() {
  app.innerHTML = `<h1>Админка</h1>
    <div class="card"><h2>Текущий вопрос</h2><p class="hint" id="cq"></p><div id="qb">${Object.keys(Q).map(n => `<button data-n="${n}">${n}</button>`).join('')}</div><button id="nx">Следующий вопрос</button></div>
    <div class="card"><h2>Освободить место</h2><p class="hint">Если человек ушёл или отсканировал не тот QR</p><input id="rs" placeholder="B7"><button id="rb">Освободить</button></div>
    <div class="card danger"><h2>Очистить тестовые данные</h2><p class="hint">Удаляет все места и ответы. Нажмите один раз перед мероприятием.</p><button id="ra">Очистить всё</button></div>
    <p id="msg"></p>`;
  let cq = 1;
  const show = n => { cq = n; $('#cq').textContent = 'Сейчас на экране: вопрос ' + n + '. ' + Q[n].q; };
  const run = async f => { const r = await f(); $('#msg').textContent = r.error ? 'Ошибка: ' + r.error.message : 'Готово'; return r; };
  const set = async n => { const r = await run(() => db.from('state').upsert({id: 1, current_question: n})); if (!r.error) show(n); };
  getQuestion().then(show);
  $('#qb').onclick = e => { if (e.target.dataset.n) set(+e.target.dataset.n); };
  $('#nx').onclick = () => set(Math.min(cq + 1, TOTAL));
  $('#rb').onclick = () => run(() => db.from('people').delete().eq('seat', $('#rs').value.toUpperCase()));
  $('#ra').onclick = () => confirm('Удалить все места и ответы?') && run(async () => {
    await db.from('answers').delete().neq('device_id', '');
    return db.from('people').delete().neq('device_id', '');
  });
}

// ---------- QR-листы ----------
function qrSheet() {
  const base = location.origin + location.pathname;
  app.innerHTML = '<div class="qrs" id="qs"></div>';
  ROWS.forEach(r => { for (let n = 1; n <= NUMS; n++) {
    const s = r + n, c = document.createElement('div');
    c.className = 'qc';
    c.innerHTML = `<div></div><b>${s}</b>`;
    $('#qs').append(c);
    new QRCode(c.firstChild, {text: base + '?seat=' + s, width: 120, height: 120});
  } });
}

// ---------- Роутер ----------
if (q.has('seat')) phone();
else if (q.has('screen')) screenView();
else if (q.has('admin')) admin();
else if (q.has('qr')) qrSheet();
else app.innerHTML = `<h1>Живой опрос ${V}</h1><div class="home">
  <a href="?screen">📺 Большой экран</a><a href="?screen&test">🧪 Экран в тесте (клик по месту показывает QR)</a>
  <a href="?admin">⚙️ Админка</a><a href="?qr">🖨️ QR-коды мест</a><a href="?seat=A1">📱 Тест телефона (место A1)</a></div>`;
</script></body></html>
